name: Validate UI Library

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ui-library-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate architecture and source contracts
        run: |
          node --test scripts/publish-release.test.mjs
          pnpm run test:button-system
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate behavior, accessibility and coverage
        run: |
          pnpm run test:storybook
          pnpm run test:coverage

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public package and budgets
        run: |
          pnpm run build
          pnpm run check:api
          pnpm run test:bundle
          pnpm run test:package

  visual:
    name: visual (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build catalog
        run: pnpm run build:storybook

      - name: Select a disjoint catalog partition
        env:
          LAYOUT_SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          const index = JSON.parse(readFileSync('storybook-static/index.json', 'utf8'))
          const ids = Object.values(index.entries)
            .filter((entry) => entry.type === 'story')
            .map((entry) => entry.id)
            .sort()
          const groups = Array.from({ length: 4 }, (_, shard) =>
            ids.filter((_, position) => position % 4 === shard),
          )
          assert.equal(new Set(groups.flat()).size, ids.length)
          assert.equal(groups.flat().length, ids.length)
          assert(groups.every((group) => group.length > 0))
          const selected = groups[Number(process.env.LAYOUT_SHARD)]
          assert(selected?.length)
          appendFileSync(process.env.GITHUB_ENV, `LAYOUT_AUDIT_STORIES=${selected.join(',')}\n`)
          console.log(`Partition ${process.env.LAYOUT_SHARD}: ${selected.length}/${ids.length} stories`)
          NODE

      - name: Validate catalog layouts
        run: |
          node scripts/test-layout-action-contracts.mjs
          LAYOUT_AUDIT_SCREENSHOTS=1 node scripts/audit-storybook-layout.mjs

      - name: Upload static catalog
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v5
        with:
          name: ui-catalog-${{ github.sha }}
          path: storybook-static
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual evidence on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-library-layout-audit-${{ github.sha }}-${{ matrix.shard }}
          path: .local/layout-audit
          if-no-files-found: ignore
          retention-days: 7

  validate:
    if: always()
    needs:
      - architecture
      - package
      - tests
      - visual
    runs-on: ubuntu-latest
    steps:
      - name: Require every UI gate
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          test "${ARCHITECTURE_RESULT}" = success
          test "${PACKAGE_RESULT}" = success
          test "${TESTS_RESULT}" = success
          test "${VISUAL_RESULT}" = success
