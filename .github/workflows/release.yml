name: Release UI Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ui-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid release tag.' >&2
            exit 1
          fi
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${version}." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate package and visual layout
        run: pnpm run validate:ui

      - name: Upload release visual evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-library-release-layout-${{ github.sha }}
          path: .local/layout-audit
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack release and checksum
        id: pack
        shell: bash
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          asset="langyspace-ui-${{ steps.version.outputs.version }}.tgz"
          (
            cd release
            sha256sum "${asset}" > "${asset}.sha256"
          )
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs "${RELEASE_TAG}" "release/${{ steps.pack.outputs.asset }}"
